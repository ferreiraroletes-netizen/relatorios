name: Gerar build para a Hostinger

# Compila o projeto e publica o resultado (dist/) no branch "deploy",
# que é o branch configurado no "Implante de GitHub" da Hostinger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Instala dependências e compila sem permissão de escrita no repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    # Só publica o build pronto; não executa código das dependências
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist
          force_orphan: true
          commit_message: 'Build ${{ github.sha }}'
