name: Gerar build para a Hostinger

# Compila o projeto e publica o resultado (dist/) no branch "deploy",
# que é o branch configurado no "Implante de GitHub" da Hostinger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: dist
          force_orphan: true
          commit_message: 'Build ${{ github.sha }}'
